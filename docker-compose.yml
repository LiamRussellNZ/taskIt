services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskit}
      POSTGRES_USER: ${POSTGRES_USER:-taskit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taskit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-taskit}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-taskit}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  taskit-postgres-data:
